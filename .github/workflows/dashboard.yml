name: Refresh dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh public microstructure window
        run: python scripts/fetch_market_microstructure.py --skip-history --skip-30m
      - name: Rebuild HTML dashboard
        run: python scripts/build_dashboard.py
      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/normalized/limit_down_pool_recent.csv data/normalized/shenwan_level1_microstructure_recent_official.csv data/normalized/dashboard_etf_features.csv data/normalized/microstructure_manifest.json
          git diff --cached --quiet || git commit -m "chore: refresh daily dashboard"
          git push
